name: Update tvJSON from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-json:
    if: startsWith(github.event.issue.title, 'tvjson update')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract JSON from issue body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body || '';

            const match = body.match(/JSON_START\s*([\s\S]*?)\s*JSON_END/);

            if (!match) {
              core.setFailed("No JSON found between JSON_START and JSON_END");
              return;
            }

            const json = match[1].trim();

            try {
              JSON.parse(json);
            } catch (err) {
              core.setFailed("Invalid JSON: " + err.message);
              return;
            }

            fs.writeFileSync("tvJSON.json", json);
            console.log("tvJSON.json updated");

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tvJSON.json
          git diff --cached --quiet || git commit -m "Update tvJSON.json"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
