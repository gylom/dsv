name: Update tvJSON from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-json:
    if: startsWith(github.event.issue.title, 'tvjson update')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and write JSON from issue body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const rawBody = context.payload.issue.body || '';
            const trimmed = rawBody.trim();

            console.log('Issue number:', context.payload.issue.number);
            console.log('Body length:', rawBody.length);
            console.log('Trimmed length:', trimmed.length);
            console.log('Body preview:', trimmed.slice(0, 200));

            if (!trimmed) {
              core.setFailed('Issue body is empty after trimming. Refusing to overwrite tvJSON.json.');
              return;
            }

            try {
              JSON.parse(trimmed);
            } catch (err) {
              core.setFailed(`Issue body is not valid JSON: ${err.message}`);
              return;
            }

            fs.writeFileSync('tvJSON.json', trimmed, 'utf8');
            console.log('tvJSON.json written successfully.');

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvJSON.json
          git diff --cached --quiet && exit 0
          git commit -m "Update tvJSON.json from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            })
