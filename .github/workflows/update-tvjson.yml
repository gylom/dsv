name: Update tvJSON.json

on:
  repository_dispatch:
    types: [update-tvjson]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write tvJSON.json from base64 payload
        shell: bash
        run: |
          echo "${{ github.event.client_payload.b64 }}" | base64 -d > tvJSON.json

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "power-automate-bot"
          git config user.email "power-automate-bot@users.noreply.github.com"
          git add tvJSON.json
          git commit -m "${{ github.event.client_payload.message || 'Update tvJSON.json' }}" || exit 0
          git push
